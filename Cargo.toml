[package]
name = "crownotify"
version = "0.1.0"
edition = "2024"
authors = ["Rama Krishnan <ramakrishnan@gmail.com>"]

# The protocol schema alone, by default-features = false. Clients — the bar's
# notification pill, a keybinding helper — get the typed contract without the
# daemon's rendering, decoding and D-Bus stack. See the `daemon` feature.
[lib]
name = "crownotify"
path = "src/lib.rs"

[[bin]]
name = "crownotify"
path = "src/main.rs"
required-features = ["daemon"]

[features]
default = ["daemon"]
# Everything but the wire contract: the store, both windows, both transports.
daemon = [
  "crownos-ipc/calloop",
  "dep:crownlink-linux",
  "dep:crownui",
  "dep:tokio",
  "dep:anyhow",
  "dep:thiserror",
  "dep:log",
  "dep:env_logger",
  "dep:calloop",
  "dep:chrono",
  "dep:toml",
  "dep:smol",
  "dep:async-channel",
  "dep:zbus",
  "dep:image",
  "dep:usvg",
  "dep:resvg",
  "dep:tiny-skia",
]

[dependencies]
crownos-ipc = { workspace = true }
# The phone companion's schema only; the cards call it, nothing else does.
crownlink-linux = { workspace = true, optional = true }
# `protocol!` generates serde structs for every method and event, so the
# schema half needs this even with `daemon` off.
serde = { workspace = true }

crownui = { workspace = true, optional = true }
# The windows follow the daemon's snapshots through a `watch`, awaited by
# `cx.spawn` on crownui's own tokio executor.
tokio = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
log = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }

calloop = { workspace = true, optional = true }

chrono = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
smol = { workspace = true, optional = true }
async-channel = { workspace = true, optional = true }
zbus = { workspace = true, optional = true }

image = { workspace = true, optional = true }
usvg = { workspace = true, optional = true }
resvg = { workspace = true, optional = true }
tiny-skia = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

[workspace]
members = ["."]
resolver = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[workspace.dependencies]
crownos-ipc = { git = "https://github.com/crown-os/crownos-ipc" }
crownlink-linux = { git = "https://github.com/crown-os/crownlink-linux", default-features = false }
serde = { version = "1.0", features = ["derive"] }
crownui = { version = "0.1.1", default-features = false, features = ["wayland", "impeller", "static", "tokio"] }
tokio = { version = "1", default-features = false, features = ["sync", "time"] }
anyhow = "1.0.102"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
calloop = "0.13"
chrono = "0.4.45"
toml = "0.9"
smol = "2.0.2"
async-channel = "2"
zbus = "5.16.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
usvg = "0.43"
resvg = "0.43"
tiny-skia = "0.11"
tempfile = "3"

[patch."https://github.com/crown-os/crownlink-linux"]
crownlink-linux = { path = "../crownlink-linux" }

[patch."https://github.com/crown-os/crownos-ipc"]
crownos-ipc = { path = "../crownos-ipc" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
