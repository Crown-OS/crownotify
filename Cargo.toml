[package]
name = "crownotify"
version = "0.1.0"
edition = "2024"
authors = ["Rama Krishnan <ramakrishnan@gmail.com>"]


[dependencies]
crownshell = { path = "../crownshell" }

anyhow = "1.0.102"
log = "0.4"
env_logger = "0.11"

vello = "0.9.0"
parley = "0.6"
calloop = "0.13"

chrono = "0.4.45"
serde = { version = "1.0", features = ["derive"] }
smol = "2.0.2"
zbus = "5.16.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
