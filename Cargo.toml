[package]
name = "crownotify"
version = "0.1.0"
edition = "2024"
authors = ["marvelxcodes <ramakrishnan0046@gmail.com>"]
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Crown-OS/crownotify"
homepage = "https://github.com/Crown-OS/crownotify"
description = "Notification daemon for CrownOS."
keywords = ["crownos", "wayland", "notifications", "dbus", "layershell"]
categories = ["gui", "os::linux-apis"]
readme = "README.md"
documentation = "https://docs.rs/crownotify"

[dependencies]
crownshell = "0.3"

anyhow = "1.0.104"
log = "0.4"
env_logger = "0.11"

vello = "0.9.0"
parley = "0.6"
calloop = "0.13"

smol = "2.0.2"
zbus = "5.16.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
